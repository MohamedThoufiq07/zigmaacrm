services:
  db:
    image: postgres:16-alpine
    container_name: zigmaa_db
    restart: always
    environment:
      POSTGRES_USER: zigmaa
      POSTGRES_PASSWORD: zigmaa_secure_pass
      POSTGRES_DB: zigmaa_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zigmaa -d zigmaa_crm"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zigmaa_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zigmaa_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://zigmaa:zigmaa_secure_pass@db:5432/zigmaa_crm
      - POSTGRES_USER=zigmaa
      - POSTGRES_PASSWORD=zigmaa_secure_pass
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=zigmaa_crm
      - SECRET_KEY=zigmaa_enterprise_production_secret_key_change_me
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zigmaa_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: zigmaa_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - zigmaa_network

  nginx:
    image: nginx:alpine
    container_name: zigmaa_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - zigmaa_network

volumes:
  postgres_data:

networks:
  zigmaa_network:
    driver: bridge
